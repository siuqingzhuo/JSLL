"excerpt":"简述总体国家安全观的五个统筹。","batch":"20261029","unit":"P3S3"}],"red":false,"supplemented":true,"focus":true},{"id":"F-033","type":"single","chapter":2,"section":"重点与易错辨析","question":"“既保护国家领土，也保障人民的生命与权益”，最直接体现哪对关系？","options":[{"id":"A","text":"内部安全与外部安全"},{"id":"B","text":"自身安全与共同安全"},{"id":"C","text":"传统安全与非传统安全"},{"id":"D","text":"国土安全与国民安全"}],"correct":["D"],"explanation":"国土与国民分别着眼领土和人民，不能把“国土安全”理解为总体国家安全的全部。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":["UR5"],"sources":[{"kind":"pdf","label":"军事理论考点.pdf · 第3页 · S3","page":3,"excerpt":"简述总体国家安全观的五个统筹。","batch":"20261029","unit":"P3S3"}],"red":false,"supplemented":true,"focus":true},{"id":"F-034","type":"single","chapter":2,"section":"重点与易错辨析","question":"“关注军事威胁的同时，也重视网络、生物等风险”，主要体现哪项统筹？","options":[{"id":"A","text":"以局部安全取代整体安全"},{"id":"B","text":"传统安全与非传统安全"},{"id":"C","text":"仅统筹国内与国外"},{"id":"D","text":"只重视军事安全"}],"correct":["B"],"explanation":"这是不同安全领域之间的统筹。传统与非传统安全相互关联，不应割裂。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":["UR5"],"sources":[{"kind":"word","label":"军事理论(2).docx · 第59段","paragraph":59,"excerpt":"54、军事安全是传统安全（粮食、信息……非传统安全）","batch":"20261029","unit":"D59"},{"kind":"pdf","label":"军事理论考点.pdf · 第3页 · S3","page":3,"excerpt":"简述总体国家安全观的五个统筹。","batch":"20261029","unit":"P3S3"}],"red":false,"supplemented":true,"focus":true},{"id":"F-035","type":"judge","chapter":2,"section":"重点与易错辨析","question":"统筹自身安全与共同安全，意味着只要增强本国安全，就可以不考虑对其他国家安全的影响。","options":[{"id":"T","text":"正确"},{"id":"F","text":"错误"}],"correct":["F"],"explanation":"该统筹强调自身安全与其他国家共同安全的联系，不能把两者对立或只顾一方。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":["UR5"],"sources":[{"kind":"pdf","label":"军事理论考点.pdf · 第3页 · S3","page":3,"excerpt":"简述总体国家安全观的五个统筹。","batch":"20261029","unit":"P3S3"}],"red":false,"supplemented":false,"focus":true},{"id":"F-036","type":"judge","chapter":2,"section":"重点与易错辨析","question":"统筹发展与安全，就是先完成全部发展目标，再开始处理安全问题。","options":[{"id":"T","text":"正确"},{"id":"F","text":"错误"}],"correct":["F"],"explanation":"发展与安全应协调推进，相互支撑，不能理解为先后完全割裂的两个阶段。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":["UR5"],"sources":[{"kind":"word","label":"军事理论(2).docx · 第71段","paragraph":71,"excerpt":"坚持党的绝对领导、坚持总体国家安全观，坚持法治和保障人权，以人民安全为宗旨，统筹发展和安全，","batch":"20261029","unit":"D71"},{"kind":"pdf","label":"军事理论考点.pdf · 第3页 · S3","page":3,"excerpt":"简述总体国家安全观的五个统筹。","batch":"20261029","unit":"P3S3"},{"kind":"pdf","label":"军事理论考点.pdf · 第3页 · S7","page":3,"excerpt":"维护国家安全的基本原则是什么？","batch":"20261029","unit":"P3S7"}],"red":false,"supplemented":false,"focus":true},{"id":"F-037","type":"multiple","chapter":2,"section":"重点与易错辨析","question":"资料所列维护国家安全原则中，哪些理解正确？","options":[{"id":"A","text":"坚持预防为主并兼顾标本治理"},{"id":"B","text":"统筹安全与经济社会发展"},{"id":"C","text":"坚持党的领导"},{"id":"D","text":"只在风险造成损失后才应采取措施"},{"id":"E","text":"依法维护国家安全"}],"correct":["A","B","C","E"],"explanation":"预防为主不等于事后才应对；各项原则需要结合，不能孤立理解。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":[],"sources":[{"kind":"word","label":"军事理论(2).docx · 第70段","paragraph":70,"excerpt":"维护国家安全基本原则","batch":"20261029","unit":"D70"},{"kind":"word","label":"军事理论(2).docx · 第71段","paragraph":71,"excerpt":"坚持党的绝对领导、坚持总体国家安全观，坚持法治和保障人权，以人民安全为宗旨，统筹发展和安全，","batch":"20261029","unit":"D71"},{"kind":"pdf","label":"军事理论考点.pdf · 第3页 · S7","page":3,"excerpt":"维护国家安全的基本原则是什么？","batch":"20261029","unit":"P3S7"}],"red":false,"supplemented":true,"focus":true},{"id":"F-038","type":"judge","chapter":2,"section":"重点与易错辨析","question":"“预防为主”意味着风险发生后的处置和消除隐患都不再重要。","options":[{"id":"T","text":"正确"},{"id":"F","text":"错误"}],"correct":["F"],"explanation":"“为主”强调重点，不等于“只有”；要结合标本兼治等要求理解。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":[],"sources":[{"kind":"word","label":"军事理论(2).docx · 第13段","paragraph":13,"excerpt":"8、维护国家安全以预防为主","batch":"20261029","unit":"D13"},{"kind":"word","label":"军事理论(2).docx · 第71段","paragraph":71,"excerpt":"坚持党的绝对领导、坚持总体国家安全观，坚持法治和保障人权，以人民安全为宗旨，统筹发展和安全，","batch":"20261029", abel":"军事理论(2).docx · 第20段","paragraph":20,"excerpt":"15、《孙子兵法》提出将帅应具有的5种德行是智信仁勇严","batch":"20261029","unit":"D20"},{"kind":"pdf","label":"军事理论考点.pdf · 第1页 · 选择6","page":1,"excerpt":"《孙子兵法》中《计篇》提出军队的将帅应具备的五种德行对将领的要求：智信仁勇严","batch":"20261029","unit":"P1C6"}],"red":false,"supplemented":false,"focus":true},{"id":"F-045","type":"single","chapter":3,"section":"重点与易错辨析","question":"“以正合，以奇胜”中的“奇”主要强调什么？","options":[{"id":"A","text":"灵活机动、出其不意的运用"},{"id":"B","text":"单纯追求兵力数量更多"},{"id":"C","text":"完全脱离战场情况行动"},{"id":"D","text":"始终采用固定套路"}],"correct":["A"],"explanation":"“奇”强调出其不意，与常规牵制相配合，而不是离开实际任意行动。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":[],"sources":[{"kind":"word","label":"军事理论(2).docx · 第72段","paragraph":72,"excerpt":"孙子以正合以奇胜的用兵原则","batch":"20261029","unit":"D72"},{"kind":"word","label":"军事理论(2).docx · 第73段","paragraph":73,"excerpt":"以常规手段（正）与敌交锋，以非常规手段（奇）取得胜利。‌正兵当面牵制，奇兵出其不意，正奇相生，使敌防不胜防。","batch":"20261029","unit":"D73"},{"kind":"pdf","label":"军事理论考点.pdf · 第3页 · S2","page":3,"excerpt":"简述孙子“以正合，以奇胜”的战略思维。","batch":"20261029","unit":"P3S2"}],"red":false,"supplemented":true,"focus":true},{"id":"F-046","type":"judge","chapter":3,"section":"重点与易错辨析","question":"运用“以正合，以奇胜”时，正与奇必须永远固定，不能随战场情况转化。","options":[{"id":"T","text":"正确"},{"id":"F","text":"错误"}],"correct":["F"],"explanation":"资料强调正奇相生、灵活运用，关键是结合实际形成有效配合，不是僵化标签。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":[],"sources":[{"kind":"word","label":"军事理论(2).docx · 第72段","paragraph":72,"excerpt":"孙子以正合以奇胜的用兵原则","batch":"20261029","unit":"D72"},{"kind":"word","label":"军事理论(2).docx · 第73段","paragraph":73,"excerpt":"以常规手段（正）与敌交锋，以非常规手段（奇）取得胜利。‌正兵当面牵制，奇兵出其不意，正奇相生，使敌防不胜防。","batch":"20261029","unit":"D73"},{"kind":"pdf","label":"军事理论考点.pdf · 第3页 · S2","page":3,"excerpt":"简述孙子“以正合，以奇胜”的战略思维。","batch":"20261029","unit":"P3S2"}],"red":false,"supplemented":false,"focus":true},{"id":"F-047","type":"multiple","chapter":3,"section":"重点与易错辨析","question":"哪些说法符合资料中的古代作战思想？","options":[{"id":"A","text":"无视敌情，只按固定程序行动"},{"id":"B","text":"先计后战，重视谋划"},{"id":"C","text":"活用奇正，避实击虚"},{"id":"D","text":"知彼知己，百战不殆"}],"correct":["B","C","D"],"explanation":"这些思想强调知情、谋划和灵活运用，与不顾敌情的机械行动不同。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":[],"sources":[{"kind":"word","label":"军事理论(2).docx · 第34段","paragraph":34,"excerpt":"29、中国古代作战思想此题四项全选","batch":"20261029","unit":"D34"},{"kind":"word","label":"军事理论(2).docx · 第72段","paragraph":72,"excerpt":"孙子以正合以奇胜的用兵原则","batch":"20261029","unit":"D72"},{"kind":"word","label":"军事理论(2).docx · 第73段","paragraph":73,"excerpt":"以常规手段（正）与敌交锋，以非常规手段（奇）取得胜利。‌正兵当面牵制，奇兵出其不意，正奇相生，使敌防不胜防。","batch":"20261029","unit":"D73"},{"kind":"pdf","label":"军事理论考点.pdf · 第2页 · 选择27","page":2,"excerpt":"中国古代作战思想：知彼知己，百战不殆；先计后战，诡道制胜；活用奇正 避实击虚；敌众\n我寡（ABCD全选）","batch":"20261029","unit":"P2C27"},{"kind":"pdf","label":"军事理论考点.pdf · 第3页 · S2","page":3,"excerpt":"简述孙子“以正合，以奇胜”的战略思维。","batch":"20261029","unit":"P3S2"}],"red":false,"supplemented":true,"focus":true},{"id":"F-048","type":"single","chapter":3,"section":"重点与易错辨析","question":"“先创造有利条件，再寻求交战取胜”最贴近资料中的哪种战争观？","options":[{"id":"A","text":"先胜"},{"id":"B","text":"只凭运气"},{"id":"C","text":"以战代谋"},{"id":"D","text":"不计代价"}],"correct":["A"],"explanation":"“先胜”强调先形成取胜条件，不能误读为已经打完一次胜仗才考虑准备。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":[],"sources":[{"kind":"word","label":"军事理论(2).docx · 第29段","paragraph":29,"excerpt":"24、中国古代军事思想蕴含先胜、全胜、战胜的战争观","batch":"20261029","unit":"D29"},{"kind":"pdf","label":"军事理论考点.pdf · 第1页 · 选择23","page":1,"excerpt":"中国古代军事思想蕴含的战争观包括：先胜，全胜，战胜","batch":"20261029","unit":"P1C23"}],"red":false,"supplemented":true,"focus":true},{"id":"F-049","type":"judge","chapter":3,"section":"重点与易错辨析","question":"“全胜”的思想可以简单理解为必须把对方的一切设施和资源全部摧毁。","options":[{"id":"T","text":"正确"},{"id":"F","text":"错误"}],"correct":["F"],"explanation":"“全胜”不能按字面理解为全面毁灭，而应结合以较小代价实现政治军事目的等思想把握。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":[],"sources":[{"kind":"word","label 行动力作用的是哪一部分？","options":[{"id":"A","text":"弹头"},{"id":"B","text":"弹体结构"},{"id":"C","text":"制导系统"},{"id":"D","text":"推进系统"}],"correct":["D"],"explanation":"按功能区分：推进系统提供动力；制导系统负责导引控制相关功能；弹头承担对目标作用任务；弹体提供结构承载。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":[],"sources":[{"kind":"word","label":"军事理论(2).docx · 第35段","paragraph":35,"excerpt":"30、弹道导弹通常多级，由弹头、弹体、制导系统、推进系统构成","batch":"20261029","unit":"D35"},{"kind":"pdf","label":"军事理论考点.pdf · 第2页 · 选择28","page":2,"excerpt":"弹道导弹由弹头、弹体、制导系统、推进系统组成","batch":"20261029","unit":"P2C28"}],"red":false,"supplemented":true,"focus":true},{"id":"F-083","type":"single","chapter":5,"section":"重点与易错辨析","question":"将弹道导弹导向预定目标的相关功能，主要对应哪个基本部分？","options":[{"id":"A","text":"弹头中的毁伤部分"},{"id":"B","text":"制导系统"},{"id":"C","text":"推进系统"},{"id":"D","text":"弹体结构"}],"correct":["B"],"explanation":"制导与推进不能混用：前者涉及飞行导引，后者主要提供动力。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":[],"sources":[{"kind":"word","label":"军事理论(2).docx · 第35段","paragraph":35,"excerpt":"30、弹道导弹通常多级，由弹头、弹体、制导系统、推进系统构成","batch":"20261029","unit":"D35"},{"kind":"pdf","label":"军事理论考点.pdf · 第2页 · 选择28","page":2,"excerpt":"弹道导弹由弹头、弹体、制导系统、推进系统组成","batch":"20261029","unit":"P2C28"}],"red":false,"supplemented":true,"focus":true},{"id":"F-084","type":"judge","chapter":5,"section":"重点与易错辨析","question":"资料概括了弹道导弹的四个基本组成部分，因此可以推断所有弹道导弹都必须采用相同的级数。","options":[{"id":"T","text":"正确"},{"id":"F","text":"错误"}],"correct":["F"],"explanation":"总体组成分类并不能决定具体级数，不能把“通常”或概括性描述扩大为所有型号的绝对规则。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":[],"sources":[{"kind":"word","label":"军事理论(2).docx · 第35段","paragraph":35,"excerpt":"30、弹道导弹通常多级，由弹头、弹体、制导系统、推进系统构成","batch":"20261029","unit":"D35"},{"kind":"pdf","label":"军事理论考点.pdf · 第2页 · 选择28","page":2,"excerpt":"弹道导弹由弹头、弹体、制导系统、推进系统组成","batch":"20261029","unit":"P2C28"}],"red":false,"supplemented":false,"focus":true},{"id":"F-085","type":"multiple","chapter":5,"section":"重点与易错辨析","question":"资料将信息化装备分为哪些构成类别？","options":[{"id":"A","text":"仅有平台外形涂装而无任何信息系统"},{"id":"B","text":"信息化作战平台"},{"id":"C","text":"军事信息系统"},{"id":"D","text":"武器负载"}],"correct":["B","C","D"],"explanation":"三类构成共同发挥作用，不能把平台本身或单纯外观变化当作整个信息化装备体系。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":[],"sources":[{"kind":"word","label":"军事理论(2).docx · 第37段","paragraph":37,"excerpt":"32、信息化装备包括信息化作战平台、武器负载和军事信息系统","batch":"20261029","unit":"D37"},{"kind":"pdf","label":"军事理论考点.pdf · 第2页 · 选择30","page":2,"excerpt":"作战平台信息化装备包括信息化作战平台、武器负载、军事信息系统","batch":"20261029","unit":"P2C30"}],"red":false,"supplemented":true,"focus":true},{"id":"F-086","type":"single","chapter":5,"section":"重点与易错辨析","question":"负责军事信息传送和相关交换保障的系统，最直接对应哪一类？","options":[{"id":"A","text":"单纯动力推进系统"},{"id":"B","text":"单纯武器负载"},{"id":"C","text":"军事通信系统"},{"id":"D","text":"单纯弹体结构"}],"correct":["C"],"explanation":"通信系统服务信息传输与交换，注意与获取目标信息的侦察、预警等功能区分。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":[],"sources":[{"kind":"word","label":"军事理论(2).docx · 第27段","paragraph":27,"excerpt":"22、军事通信系统是现代作战中不可缺少的重要军事信息系统","batch":"20261029","unit":"D27"},{"kind":"word","label":"军事理论(2).docx · 第37段","paragraph":37,"excerpt":"32、信息化装备包括信息化作战平台、武器负载和军事信息系统","batch":"20261029","unit":"D37"},{"kind":"pdf","label":"军事理论考点.pdf · 第1页 · 选择11","page":1,"excerpt":"现代国家作战体系中，综合电子信息系统中最不可缺少的是军事通讯，承担信息的传送、鉴\n别。","batch":"20261029","unit":"P1C11"},{"kind":"pdf","label":"军事理论考点.pdf · 第2页 · 选择30","page":2,"excerpt":"作战平台信息化装备包括信息化作战平台、武器负载、军事信息系统","batch":"20261029","unit":"P2C30"}],"red":false,"supplemented":true,"focus":true},{"id":"F-087","type":"single","chapter":5,"section":"重点与易错辨析","question":"“尽早发现威胁并发出警报”最直接体现哪类系统的功能？","options":[{"id":"A","text":"单纯人员考勤系统"},{"id":"B","text":"单纯物资储存系统"},{"id":"C","text":"预警探测系统"},{"id":"D","text":"单纯动力系统"}],"correct":["C"],"explanation":"关键词为尽早发现和预警。与之相关的情报侦察、通信等系统可以协同，但重点功能不同。","note":"按资料知识点拓展编写；训练概念、时间、作用与易混表述的辨析，不是还原考试原题。","referenceIds":[],"sources":[{"kind":"word","label":"军事理论(2).docx · 第30段","para hsh/qmgjanjyr/ztgjaqg/202406/t20240624_1077155.html"}},"notes":["题库共604题，合并原Excel、原Word与本次新增Word和PDF；重复考点补充来源并归并。","可独立设置单选、多选、判断、简答、论述的数量；设为0即不抽取该题型。题目顺序始终随机。","单选、多选、判断为客观题，每题1分，多选必须完全选对；未答、漏选、多选均为0分。","简答题和论述题提供输入框与思路提示，不提供标准答案，不自动计分，不计入客观题正确率。交卷后可以自评并加入待复习。","错题本自动收录客观错题和未答题；主观题需点击“还需复习”手动收录，点击“已掌握”移出。","Word标红考点仍保留原有选择题覆盖；新增资料可单独筛选，也可与旧题混合抽取。","题库与全部功能嵌入同一个HTML，可离线使用。练习文字、进度和自评仅保存在当前浏览器，未上传GitHub。","不同教材、讲义和时间口径可能有差异；请结合来源说明与授课教师要求复习。"],"corrections":["新Word中的“五大军种”与2024年调整后的公开结构不符，已采用四个军种、四个兵种的口径并附核对来源。","专属经济区的200海里从测算领海宽度的基线量起，不从领海外界再向外计算200海里。","PDF的“今年”“第25个国防教育日”和“抗战胜利80周年”指2025年；相关新题明确写出年份。","战时政治动员的内容分类与网络等传播渠道不同；没有沿用“网络宣传一律错误”的绝对说法。","古田会议、三湾改编和南昌起义按不同历史作用区分；“军制”与兵役制度也不完全等同。","“预警探测全选”“综合电子信息系统全选”等记录没有原选项，仅按可核实的同主题知识点编写，不把“全选”本身当作答案。","Word第44段的判断题未记完整，PDF里的“四个运动”也无法确认原意，未凭空还原这些残缺原题。","福建舰入列不等于立即具备全部实战能力；三艘航母也不能直接推算任一时刻的固定战备状态。"]}</script><script>function createQuizEngine() {
  const typeNames={single:'单选题',multiple:'多选题',judge:'判断题',short:'简答题',essay:'论述题'};
  const subjective=q=>q.type==='short'||q.type==='essay';
  const answered=(q,value)=>subjective(q)?typeof value==='string'&&value.trim().length>0:Array.isArray(value)&&value.length>0;
  function random(){if(globalThis.crypto?.getRandomValues){const a=new Uint32Array(1);globalThis.crypto.getRandomValues(a);return a[0]/4294967296;}return Math.random();}
  function shuffle(items,rng=random){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
  function filterBank(bank,config,wrongIds=[]){const wrong=new Set(wrongIds);return bank.filter(q=>config.chapters.includes(q.chapter)&&(!config.wrongOnly||wrong.has(q.id))&&(config.source==='all'||config.source==='focus'&&q.focus||config.source==='red'&&q.red||config.source==='word'&&q.sources.some(s=>s.kind==='word')||config.source==='excel'&&q.sources.some(s=>s.kind==='excel')||config.source==='pdf'&&q.sources.some(s=>s.kind==='pdf')||config.source==='update'&&q.sources.some(s=>s.batch==='20261029')));}
  function counts(bank){return Object.fromEntries(Object.keys(typeNames).map(t=>[t,bank.filter(q=>q.type===t).length]));}
  function createPaper(bank,config,wrongIds=[],rng=random){
    const pool=filterBank(bank,config,wrongIds);let selected=[];
    for(const t of Object.keys(typeNames)){
      const n=Number(config.counts[t]??0);if(!Number.isInteger(n)||n<0)throw Error('题量须为大于或等于0的整数');
      const candidates=pool.filter(q=>q.type===t);if(n>candidates.length)throw Error(`${typeNames[t]}最多可抽 ${candidates.length} 道`);
      selected.push(...shuffle(candidates,rng).slice(0,n));
    }
    if(!selected.length)throw Error('至少选择一道题');
    return shuffle(selected,rng).map(q=>({id:q.id,order:config.shuffleOptions&&q.type!=='judge'?shuffle(q.options.map(o=>o.id),rng):q.options.map(o=>o.id)}));
  }
  function isCorrect(q,selection=[]){if(subjective(q))return null;return Array.isArray(selection)&&selection.length===q.correct.length&&new Set(selection).size===selection.length&&selection.every(id=>q.correct.includes(id));}
  function grade(bank,paper,answers){const map=new Map(bank.map(q=>[q.id,q]));const results=paper.map(item=>{const q=map.get(item.id);if(!q)throw Error('试卷题目不存在');const chosen=answers[q.id];return {id:q.id,subjective:subjective(q),correct:isCorrect(q,chosen),blank:!answered(q,chosen)};});const objective=results.filter(r=>!r.subjective),subjectives=results.filter(r=>r.subjective),correct=objective.filter(r=>r.correct).length;return {results,total:paper.length,objectiveTotal:objective.length,subjectiveTotal:subjectives.length,subjectiveAnswered:subjectives.filter(r=>!r.blank).length,correct,wrong:objective.filter(r=>!r.correct&&!r.blank).length,blank:objective.filter(r=>r.blank).length,percent:objective.length?Math.round(correct/objective.length*100):null};}
  function validSession(session,bank){
    if(!session||!Array.isArray(session.paper)||!session.paper.length||!session.answers)return false;
    const map=new Map(bank.map(q=>[q.id,q]));const ids=new Set();
    for(const item of session.paper){const q=map.get(item.id);if(!q||ids.has(item.id)||!Array.isArray(item.order)||item.order.length!==q.options.length||new Set(item.order).size!==q.options.length||item.order.some(id=>!q.options.some(o=>o.id===id)))return false;ids.add(item.id);const a=session.answers[item.id];if(subjective(q)){if(a!==undefined&&(typeof a!=='string'||a.length>20000))return false;}else{const selected=a??[];if(!Array.isArray(selected)||new Set(selected).size!==selected.length||selected.some(id=>!item.order.includes(id))||(q.type!=='multiple'&&selected.length>1))return false;}}
    return Number.isFinite(session.startedAt)&&Number.isInteger(session.index)&&session.index>=0&&session.index<session.paper.length;
  }
  return {typeNames,subjective,answered,shuffle,filterBank,counts,createPaper,isCorrect,grade,validSession};
}
if(typeof module!=='undefined')module.exports=createQuizEngine;

'use strict';

let wrongConfig=defaults();wrongConfig.wrongOnly=true;

let wrong=Object.fromEntries(Object.entries(saved.wrong||{}).filter(([id,v])=>byId.has(id)&&v&&typeof v==='object'));
let history=Array.isArray(saved.history)?saved.history.filter(x=>x&&Number.isFinite(x.total)&&Number.isFinite(x.correct)&&Number.isFinite(x.at)).slice(0,30):[];
let view='home',libPage=1,libQuery='',libType='all',libSource='all',revealed=new Set(),reviewFilter='wrong',reviewPage=1;
let dialogCallback=null,toastTimer;

function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').classList.add('show');toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3600);}
function confirmAction(title,text,callback,label='确认'){dialogCallback=callback;$('#dialogTitle').textContent=title;$('#dialogText').textContent=text;$('#dialogConfirm').textContent=label;$('#confirmDialog').showModal();}
$('#dialogCancel').onclick=()=>{$('#confirmDialog').close();dialogCallback=null;};
$('#dialogConfirm').onclick=()=>{const fn=dialogCallback;dialogCallback=null;$('#confirmDialog').close();if(fn)fn();};
$('#confirmDialog').addEventListener('cancel',()=>{dialogCallback=null;});
function duration(ms){const sec=Math.max(0,Math.floor(ms/1000));return [Math.floor(sec/3600),Math.floor(sec/60)%60,sec%60].map(n=>String(n).padStart(2,'0')).join(':');}
function sessionTime(){return session?duration((session.submittedAt||Date.now())-session.startedAt):'00:00:00';}
function answeredCount(){return session?session.paper.filter(p=>Engine.answered(byId.get(p.id),session.answers[p.id])).length:0;}

function updateNav(){for(const b of $$('[data-nav]')){const active=b.dataset.nav===view||(view==='exam'||view==='results')&&b.dataset.nav==='home';b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}$('#wrongCount').textContent=Object.keys(wrong).length;$('#bankTotal').textContent=DATA.meta.total;}
function navigate(next){view=next;updateNav();render();window.scrollTo({top:0,behavior:'instant'});}
function render(){if(view==='home'||view==='wrong')renderHome();else if(view==='exam')renderExam();else if(view==='results')renderResults();else if(view==='library')renderLibrary();else renderHelp();}
function clampCounts(cfg){const available=Engine.counts(Engine.filterBank(BANK,cfg,Object.keys(wrong)));for(const t of Object.keys(TYPE_NAMES))cfg.counts[t]=Math.max(0,Math.min(Number(cfg.counts[t])||0,available[t]));return available;}
function renderHome(){
  const cfg=currentConfig(),available=clampCounts(cfg),isWrong=view==='wrong';
  if(isWrong&&!Object.keys(wrong).length){$('#content').innerHTML=`<div class="hero"><div><div class="eyebrow">REVIEW & GROW</div><h1>我的错题</h1><p>客观错题、未答题自动收录；主观题可在复盘时标记“还需复习”。</p></div></div><div class="card empty"><div class="empty-symbol">◎</div><h2>还没有错题</h2><p>先完成一份练习，再回来集中复习。</p><button class="primary" data-action="go-home" style="margin-top:24px">开始模拟练习</button></div>`;return;}
  const unfinished=session&&!session.submittedAt;
  $('#content').innerHTML=`<header class="hero"><div><div class="eyebrow">${isWrong?'FOCUS ON WHAT MATTERS':'YOUR PRACTICE, YOUR PACE'}</div><h1>${isWrong?'让错题变成会做的题。':'自定义一份练习。'}</h1><p>${isWrong?`错题本现有 ${Object.keys(wrong).length} 道题。客观题重做答对后自动移出；主观题选择“已掌握”后移出。`:'选择章节、题型和题量，每次生成顺序不同的新试卷。'}</p></div><span class="edition">薛高连 · 张冬梅 / 第二版</span></header>
  ${session?.submittedAt?`<div class="resume"><div><strong>上次的作答与自评已保存</strong><p>可返回复盘，查看客观题答案和主观题文字。</p></div><button class="secondary" data-action="last-results">查看上次作答 →</button></div>`:''}
  ${unfinished?`<div class="resume"><div><strong>上次的练习还在这里</strong><p>已答 ${answeredCount()} / ${session.paper.length} 题，继续时会保留选项顺序与答案。</p></div><button class="secondary" data-action="resume">继续作答 →</button></div>`:''}
  <div class="grid"><section class="card"><div class="section-label"><span class="num">01</span><h3>选择范围</h3></div><div class="segmented" role="group" aria-label="题目来源">${[['all','全部题目'],['focus','重点与易错专项'],['update','本次新资料'],['pdf','PDF 考点'],['red','Word 标红'],['word','Word 全部'],['excel','Excel 题库']].map(([value,label])=>`<label><input type="radio" name="source" value="${value}" ${cfg.source===value?'checked':''}>${label}</label>`).join('')}</div><div class="between" style="margin-bottom:10px"><small>章节范围</small><button class="text-btn" data-action="all-chapters">全选章节</button></div><div class="chips">${DATA.meta.chapters.map((name,i)=>`<label class="chip"><input type="checkbox" name="chapter" value="${i+1}" ${cfg.chapters.includes(i+1)?'checked':''}>${i+1}. ${name}</label>`).join('')}</div><hr class="line"><div class="between"><div class="section-label" style="margin:0"><span class="num">02</span><h3>设置题量</h3></div><div class="row"><button class="text-btn" data-action="subjective-preset">练简答 / 论述</button><button class="text-btn" data-action="fill-counts">抽取全部可用题</button></div></div><p class="note" style="margin-top:7px">不想抽某种题型，将数量设为 0。</p><div>${Object.entries(TYPE_NAMES).map(([t,label])=>`<div class="quantity"><div><strong><i class="type-dot ${t}"></i>${label}</strong><small id="stock-${t}">当前范围可用 ${available[t]} 道</small></div><div class="stepper"><button data-step="${t}" data-delta="-1" aria-label="减少${label}" ${available[t]===0?'disabled':''}>−</button><label class="sr-only" for="count-${t}">${label}数量</label><input id="count-${t}" name="count" data-type="${t}" type="number" min="0" max="${available[t]}" value="${cfg.counts[t]}" inputmode="numeric" ${available[t]===0?'disabled':''}><button data-step="${t}" data-delta="1" aria-label="增加${label}" ${available[t]===0?'disabled':''}>+</button></div></div>`).join('')}</div><hr class="line"><div class="section-label"><span class="num">03</span><h3>练习方式</h3></div><div class="checks"><div class="row" style="font-size:13px"><span style="color:var(--green)">✓</span>题目顺序始终随机，五种题型可混排</div><label><input type="checkbox" id="shuffleOptions" ${cfg.shuffleOptions?'checked':''}>同时打乱单选、多选的选项顺序</label><div class="row" style="font-size:13px"><span style="color:var(--green)">✓</span>客观题自动评分；简答、论述查看提示并自评</div></div></section><aside><section class="card summary"><h3>本次练习</h3><div class="large-number" id="total-display">0<span>题</span></div><p style="color:#b7cbbd;font-size:13px">从所选范围随机抽取，不重复出题。</p><div class="summary-list"><div class="between"><span>单选题</span><b id="sum-single">0 道</b></div><div class="between"><span>多选题</span><b id="sum-multiple">0 道</b></div><div class="between"><span>判断题</span><b id="sum-judge">0 道</b></div><div class="between"><span>简答题</span><b id="sum-short">0 道</b></div><div class="between"><span>论述题</span><b id="sum-essay">0 道</b></div><div class="between"><span>计分方式</span><span>客观题 1 分 / 主观自评</span></div></div><button class="primary full" id="startButton" data-action="start">生成试卷并开始 →</button><p class="note">客观题漏选、多选、未答计 0 分。简答、论述不自动计分。</p></section><p class="note" style="padding:0 9px">${isWrong?'重复练习只从当前错题本抽取。':'合并四份复习资料，共 604 题。可单练重点与易错题；简答、论述提供思路提示。'}</p>${!storageOK?'<p class="note" style="color:var(--red)">当前浏览器无法保存进度，请完成后再关闭页面。</p>':''}</aside></div><div class="stats-strip"><div class="stat"><b>${DATA.meta.total}</b><span>全部题目</span></div><div class="stat"><b>${DATA.meta.updateAdded}</b><span>本次新编题目</span></div><div class="stat"><b>${DATA.meta.updateSubjective}</b><span>仅提示的主观题</span></div></div>`;
  updateSummary();
}
function updateSummary(){const cfg=currentConfig();let total=0,valid=cfg.chapters.length>0;const available=Engine.counts(Engine.filterBank(BANK,cfg,Object.keys(wrong)));for(const t of Object.keys(TYPE_NAMES)){const n=Number(cfg.counts[t]);if(!Number.isInteger(n)||n<0||n>available[t])valid=false;total+=Number.isFinite(n)?n:0;const el=$('#sum-'+t);if(el)el.textContent=n+' 道';}if($('#total-display'))$('#total-display').innerHTML=esc(total)+'<span>题</span>';if($('#startButton'))$('#startButton').disabled=!valid||total<=0;}
function begin(cfg){
  try{const paper=Engine.createPaper(BANK,cfg,Object.keys(wrong));session={paper,answers:{},selfAssess:{},flags:[],index:0,startedAt:Date.now(),submittedAt:null,config:clone(cfg)};persist();navigate('exam');}catch(e){toast(e.message);}
}
function startRequested(){const cfg=clone(currentConfig());if(session&&!session.submittedAt)confirmAction('开始一份新试卷？','当前未完成试卷将被替换。已经交卷的历史记录和错题本会保留。',()=>begin(cfg),'生成新试卷');else begin(cfg);}
function letterFor(item,optionId,q){if(q.type==='judge')return optionId==='T'?'√':'×';return String.fromCharCode(65+item.order.indexOf(optionId));}
function renderExam(){
  if(!session){navigate('home');return;}if(session.submittedAt){navigate('results');return;}
  const item=session.paper[session.index],q=byId.get(item.id),subjective=Engine.subjective(q),selected=session.answers[q.id]??(subjective?'':[]),flag=session.flags.includes(q.id);
  const answerArea=subjective?`<label class="written-label" for="writtenAnswer">写下你的思路或完整作答</label><textarea id="writtenAnswer" class="written-answer" rows="10" maxlength="20000" placeholder="可以先列提纲，再组织成文。文字会自动保存。">${esc(selected)}</textarea><div class="between"><span class="note">${esc(q.writingAdvice||'按自己的思路作答')}</span><small id="writtenCount">${selected.replace(/\s/g,'').length} 字</small></div><details class="hint-box"><summary>需要一点提示？展开作答思路</summary>${hintsHtml(q)}</details>`:`<div class="options" role="group" aria-labelledby="question-title">${item.order.map(id=>{const o=q.options.find(o=>o.id===id),checked=selected.includes(id);return `<label class="option ${checked?'selected':''}"><input type="${q.type==='multiple'?'checkbox':'radio'}" name="exam-answer" value="${esc(id)}" ${checked?'checked':''}><span class="letter" aria-hidden="true">${letterFor(item,id,q)}</span><span class="option-text">${esc(o.text)}</span></label>`;}).join('')}</div>`;
  $('#content').innerHTML=`<div class="between" style="margin-bottom:24px;flex-wrap:wrap"><button class="text-btn" data-action="save-home">← 返回配置，保留进度</button><div class="row"><small>本次用时</small><span class="clock" data-time>${sessionTime()}</span></div></div><div class="hero"><div><div class="eyebrow">PRACTICE IN PROGRESS</div><h1>第 ${session.index+1} 题 <span style="font-size:18px;color:var(--muted);font-weight:400">/ ${session.paper.length}</span></h1></div><button class="secondary" data-action="submit">结束作答并交卷</button></div><div class="grid"><section class="card"><div class="q-meta"><span class="badge">${TYPE_NAMES[q.type]}</span><span class="badge">${esc(DATA.meta.chapters[q.chapter-1])}</span>${q.focus?'<span class="badge gold">重点 / 易错</span>':''}${q.red?'<span class="badge gold">Word 标红重点</span>':''}<small>${subjective?'仅提供思路提示 · 不自动评分':q.type==='multiple'?'选择所有正确选项':'请选择一个答案'}</small></div><h2 class="question" id="question-title">${esc(q.question)}</h2>${answerArea}<div class="q-bottom"><div class="row"><button class="text-btn" data-action="flag" aria-pressed="${flag}">${flag?'★ 已标记，稍后检查':'☆ 标记此题'}</button><button class="text-btn" data-action="clear-answer">清除答案</button></div><div class="row"><button class="secondary" data-action="prev" ${session.index===0?'disabled':''}>上一题</button><button class="primary" data-action="next">${session.index===session.paper.length-1?'检查并交卷':'下一题 →'}</button></div></div></section><aside class="card sticky"><div class="between"><h3>答题卡</h3><small id="answered-label">已答 ${answeredCount()} / ${session.paper.length}</small></div><div class="progressbar"><span id="exam-progress" style="width:${answeredCount()/session.paper.length*100}%"></span></div><div class="answer-grid">${session.paper.map((p,i)=>{const done=Engine.answered(byId.get(p.id),session.answers[p.id]);return `<button data-goto="${i}" class="${done?'done ':''}${i===session.index?'current ':''}${session.flags.includes(p.id)?'flagged':''}" aria-label="第${i+1}题 · ${TYPE_NAMES[byId.get(p.id).type]}${done?'，已作答':'，未作答'}" ${i===session.index?'aria-current="step"':''}>${i+1}</button>`;}).join('')}</div><div class="legend"><span>浅绿 · 已答</span><span>白色 · 未答</span><span>金点 · 标记</span></div><button class="primary full" data-action="submit">交卷并查看结果</button><p class="note">客观题自动评分；简答、论述交卷后自评。所有作答会自动保存。</p></aside></div>`;
}

function answerChanged(){if(!session||session.submittedAt)return;const q=byId.get(session.paper[session.index].id);if(Engine.subjective(q))return;session.answers[q.id]=$$('input[name="exam-answer"]:checked').map(i=>i.value);for(const input of $$('input[name="exam-answer"]'))input.closest('.option').classList.toggle('selected',input.checked);persist();updateAnswerStatus();}

function submitRequested(){if(!session||session.submittedAt)return;const g=Engine.grade(BANK,session.paper,session.answers);confirmAction('确认交卷？',`本次共 ${session.paper.length} 道题，已答 ${answeredCount()} 道。\n客观题 ${g.objectiveTotal} 道，${g.blank} 道未答；未答客观题计 0 分并收录错题本。\n简答 / 论述 ${g.subjectiveTotal} 道，只提供提示和自评，不计入正确率。`,submitPaper,'确认交卷');}

function submitPaper(){if(!session||session.submittedAt)return;session.submittedAt=Date.now();session.selfAssess=session.selfAssess||{};const g=Engine.grade(BANK,session.paper,session.answers);for(const r of g.results){if(r.subjective)continue;if(r.correct)delete wrong[r.id];else wrong[r.id]={count:(Number(wrong[r.id]?.count)||0)+1,lastAt:session.submittedAt,blank:r.blank};}history.unshift({at:session.submittedAt,total:g.total,objectiveTotal:g.objectiveTotal,subjectiveTotal:g.subjectiveTotal,subjectiveAnswered:g.subjectiveAnswered,correct:g.correct,percent:g.percent,duration:session.submittedAt-session.startedAt});history=history.slice(0,30);reviewFilter=g.subjectiveTotal?'all':'wrong';reviewPage=1;persist();navigate('results');}

function sourceHtml(q){return `<details class="source"><summary>查看题目来源${q.supplemented?' · 含补充选项':''}</summary>${q.sources.map(s=>`<p>${esc(s.label)}</p>${s.excerpt?`<blockquote>${esc(s.excerpt)}</blockquote>`:''}`).join('')}${q.referenceIds.length?'<p>核对资料：'+q.referenceIds.map(id=>{const r=DATA.references[id];return r&&/^https?:\/\//.test(r.url)?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>`:esc(id);}).join('；')+'</p>':''}</details>`;}
function answerText(q,item,ids){if(!ids?.length)return '未作答';return item.order.filter(id=>ids.includes(id)).map(id=>`${q.type==='judge'?'':letterFor(item,id,q)+'. '}${q.options.find(o=>o.id===id).text}`).join('；');}
function questionCard(q,item,{show=false,selected=null,result=null,number=null}={}){
  if(Engine.subjective(q))return subjectCard(q,{show,selected,result,number});
  return `<article class="review-card"><div class="between"><div class="q-meta" style="margin:0"><span class="badge">${TYPE_NAMES[q.type]}</span>${q.red?'<span class="badge gold">Word 标红</span>':''}<small>${esc(DATA.meta.chapters[q.chapter-1])}${number?' · 第 '+number+' 题':''}</small></div>${result?`<span class="badge ${result.correct?'':'red'}">${result.correct?'正确':result.blank?'未答':'错误'}</span>`:''}</div><h3>${esc(q.question)}</h3><div class="review-options">${item.order.map(id=>{const option=q.options.find(o=>o.id===id);const cls=show?(q.correct.includes(id)?'correct':selected?.includes(id)?'incorrect':''):'';return `<div class="review-option ${cls}">${q.type==='judge'?'':letterFor(item,id,q)+'. '}${esc(option.text)}${show&&q.correct.includes(id)?' <span aria-label="正确选项">✓</span>':''}${show&&selected?.includes(id)?' <small>（你的选择）</small>':''}</div>`;}).join('')}</div>${show?`<div class="answer-info">${selected!==null?`<p><b>你的答案：</b>${esc(answerText(q,item,selected))}</p>`:''}<p><b>正确答案：</b>${esc(answerText(q,item,q.correct))}</p><p><b>解析：</b>${esc(q.explanation)}</p>${q.note&&q.note!=='基础概念'?`<p class="muted">${esc(q.note)}</p>`:''}</div>${sourceHtml(q)}`:`<button class="text-btn" data-reveal="${esc(q.id)}">展开答案与解析 ↓</button>`}</article>`;
}
function pager(page,total,kind){const pages=Math.max(1,Math.ceil(total/20));return `<div class="pager"><button class="secondary" data-page="${kind}" data-value="${page-1}" ${page<=1?'disabled':''}>上一页</button><span>第 ${page} / ${pages} 页</span><button class="secondary" data-page="${kind}" data-value="${page+1}" ${page>=pages?'disabled':''}>下一页</button></div>`;}
function renderResults(){
  if(!session?.submittedAt){navigate(session?'exam':'home');return;}
  const g=Engine.grade(BANK,session.paper,session.answers),subjectReview=g.results.filter(r=>r.subjective&&session.selfAssess?.[r.id]==='review').length;
  $('#content').innerHTML=`<header class="hero"><div><div class="eyebrow">PRACTICE COMPLETE</div><h1>完成练习，梳理自己的思路。</h1><p>客观题核对答案；简答和论述结合提示自评。</p></div></header><section class="card result-top"><div class="score-ring" style="--score:${(g.percent||0)*3.6}deg"><div class="score-inner"><b>${g.objectiveTotal?g.percent+'<span style="font-size:20px">%</span>':'自评'}</b><small>${g.objectiveTotal?'客观题正确率':'仅含主观题'}</small></div></div><div><h2>${g.objectiveTotal?`客观题答对 ${g.correct} / ${g.objectiveTotal} 题`:'本卷不进行自动评分'}</h2><div class="result-stats"><div><b>${g.correct}</b><span>客观答对</span></div><div><b>${g.wrong}</b><span>客观答错</span></div><div><b>${g.blank}</b><span>客观未答</span></div><div><b style="font-size:19px">${sessionTime()}</b><span>用时</span></div></div>${g.subjectiveTotal?`<p class="subjective-summary">简答 / 论述：已作答 <b>${g.subjectiveAnswered} / ${g.subjectiveTotal}</b> 道，仅供自评，不计入客观题正确率。</p>`:''}<div class="toolbar"><button class="primary" data-action="again">按原配置再抽一套</button><button class="secondary" data-action="redo">重做本卷</button><button class="text-btn" data-action="go-wrong">进入错题本 →</button></div><p class="note">客观题每题 1 分，多选完全正确才得分。主观题仅在标记“还需复习”时加入错题本。</p></div></section><div class="between" style="margin-top:28px"><h2>作答复盘</h2><small>${g.total} 道题</small></div><div class="pill-tabs">${[['wrong','错题与待复习',g.wrong+g.blank+subjectReview],['subjective','简答与论述',g.subjectiveTotal],['all','全部题目',g.total],['flagged','已标记',session.flags.length]].map(([v,label,n])=>`<button data-review="${v}" class="${reviewFilter===v?'active':''}">${label} ${n}</button>`).join('')}</div><div id="review-list"></div>`;
  renderReviewList();
}

function renderReviewList(){const g=Engine.grade(BANK,session.paper,session.answers);let items=session.paper.map((p,i)=>({p,i,r:g.results[i]}));if(reviewFilter==='wrong')items=items.filter(x=>x.r.subjective?session.selfAssess?.[x.p.id]==='review':!x.r.correct);if(reviewFilter==='subjective')items=items.filter(x=>x.r.subjective);if(reviewFilter==='flagged')items=items.filter(x=>session.flags.includes(x.p.id));const pages=Math.max(1,Math.ceil(items.length/20));reviewPage=Math.min(reviewPage,pages);$('#review-list').innerHTML=items.length?items.slice((reviewPage-1)*20,reviewPage*20).map(x=>questionCard(byId.get(x.p.id),x.p,{show:true,selected:session.answers[x.p.id]??(x.r.subjective?'':[]),result:x.r,number:x.i+1})).join('')+pager(reviewPage,items.length,'review'):`<div class="card empty"><div class="empty-symbol">✓</div><h2>当前范围没有题目</h2><p>${reviewFilter==='wrong'?'没有客观错题或标记待复习的主观题。':'可以切换到全部题目查看作答。'}</p></div>`;}

function renderLibrary(){
  $('#content').innerHTML=`<header class="hero"><div><div class="eyebrow">QUESTION LIBRARY</div><h1>把知识点逐个弄清楚。</h1><p>搜索题干、选项、解析与提示；可以筛选新增资料或主观题。</p></div><span class="edition">共 ${DATA.meta.total} 道练习题</span></header><div class="search"><label class="sr-only" for="searchInput">搜索题库</label><input type="search" id="searchInput" placeholder="搜索关键词，如：国防动员、孙子兵法…" value="${esc(libQuery)}"><label class="sr-only" for="libType">筛选题型</label><select id="libType"><option value="all">全部题型</option>${Object.entries(TYPE_NAMES).map(([v,t])=>`<option value="${v}" ${libType===v?'selected':''}>${t}</option>`).join('')}</select><label class="sr-only" for="libSource">筛选来源</label><select id="libSource">${[['all','全部来源'],['focus','重点与易错专项'],['update','本次新资料'],['pdf','PDF 考点'],['red','Word 标红'],['word','Word 全部'],['excel','Excel 题库']].map(([v,t])=>`<option value="${v}" ${libSource===v?'selected':''}>${t}</option>`).join('')}</select></div><div id="library-list"></div>`;renderLibraryList();
}
function renderLibraryList(){const term=libQuery.trim().toLocaleLowerCase();const pool=Engine.filterBank(BANK,{chapters:[1,2,3,4,5],source:libSource,wrongOnly:false});const filtered=pool.filter(q=>(libType==='all'||q.type===libType)&&(!term||[q.question,q.explanation,...(q.hints||[]),...q.options.map(o=>o.text)].join(' ').toLocaleLowerCase().includes(term)));libPage=Math.min(libPage,Math.max(1,Math.ceil(filtered.length/20)));$('#library-list').innerHTML=`<p class="library-caption">找到 ${filtered.length} 道题 · 每页 20 道</p>`+(filtered.length?filtered.slice((libPage-1)*20,libPage*20).map(q=>questionCard(q,{id:q.id,order:q.options.map(o=>o.id)},{show:revealed.has(q.id)})).join('')+pager(libPage,filtered.length,'library'):'<div class="card empty"><h2>没有找到相关题目</h2><p>试试更短的关键词或更换筛选范围。</p></div>');}
function renderHelp(){
  $('#content').innerHTML=`<header class="hero"><div><div class="eyebrow">ABOUT THIS LIBRARY</div><h1>资料、规则与练习记录。</h1><p>四份资料合并，保留来源和口径说明。</p></div></header><div class="grid"><section><div class="card"><h2>使用说明</h2><ol class="help-list">${DATA.notes.map(n=>`<li>${esc(n)}</li>`).join('')}</ol><div class="stats-strip">${Object.entries(TYPE_NAMES).map(([t,label])=>`<div class="stat"><b>${DATA.meta.counts[t]}</b><span>${label}</span></div>`).join('')}</div><p class="note">题库用于个人复习，不等于学校官方完整考试原题库。更新：${esc(DATA.meta.version)}。</p><details class="hint-box"><summary>查看资料核对与残缺题处理说明</summary><ul class="help-list">${(DATA.corrections||[]).map(c=>`<li>${esc(c)}</li>`).join('')}</ul></details></div><div class="card"><h2>最近练习</h2>${history.length?`<table class="history"><thead><tr><th>日期</th><th>客观题得分 / 主观作答</th><th>客观正确率</th><th>用时</th></tr></thead><tbody>${history.map(h=>`<tr><td>${esc(new Date(h.at).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}))}</td><td>${(h.objectiveTotal??h.total)?`${h.correct} / ${h.objectiveTotal??h.total}`:'仅主观题'}${h.subjectiveTotal?`<br><small>主观 ${h.subjectiveAnswered} / ${h.subjectiveTotal} 道已答</small>`:''}</td><td>${h.percent===null?'—':h.percent+'%'}</td><td>${duration(h.duration||0)}</td></tr>`).join('')}</tbody></table>`:'<p class="note">完成并提交第一份试卷后，这里会出现记录。</p>'}</div></section><aside class="card"><h3>本地记录</h3><p class="note">${storageOK?'当前浏览器可以保存作答、进度、错题与自评。':'当前浏览器限制了本地保存，关闭页面后可能丢失进度。'}</p><p class="note">移动 HTML 文件或换浏览器后，旧记录可能不会跟随。填写的主观题文字不会上传 GitHub。</p><hr class="line"><button class="secondary full" data-action="clear-storage">清除本机练习记录</button><p class="note">将删除当前作答、进度、自评、错题与历史成绩；不会删除题库。</p></aside></div>`;
}

function hintsHtml(q){return `<div class="hint-body"><p><b>作答提示 · 非标准答案</b></p><ul>${(q.hints||[]).map(h=>`<li>${esc(h)}</li>`).join('')}</ul><p class="note">${esc(q.writingAdvice||'请自行组织语言')}。提示供梳理思路，不用于自动判分。</p></div>`;}

function updateAnswerStatus(){const q=byId.get(session.paper[session.index].id),done=answeredCount(),answered=Engine.answered(q,session.answers[q.id]);$('#answered-label').textContent=`已答 ${done} / ${session.paper.length}`;$('#exam-progress').style.width=done/session.paper.length*100+'%';const current=$(`[data-goto="${session.index}"]`);current.classList.toggle('done',answered);current.setAttribute('aria-label',`第${session.index+1}题 · ${TYPE_NAMES[q.type]}${answered?'，已作答':'，未作答'}`);}

function writtenAnswerChanged(){if(!session||session.submittedAt)return;const q=byId.get(session.paper[session.index].id);if(!Engine.subjective(q))return;session.answers[q.id]=$('#writtenAnswer').value;$('#writtenCount').textContent=session.answers[q.id].replace(/\s/g,'').length+' 字';persist();updateAnswerStatus();}

function subjectCard(q,{show,selected,result,number}){const assessment=result?session.selfAssess?.[q.id]:null;const label=assessment==='mastered'?'自评 · 已掌握':assessment==='review'?'自评 · 需复习':result?.blank?'未作答 · 待自评':'待自评';return `<article class="review-card"><div class="between"><div class="q-meta" style="margin:0"><span class="badge">${TYPE_NAMES[q.type]}</span><small>${esc(DATA.meta.chapters[q.chapter-1])}${number?' · 第 '+number+' 题':''}</small></div>${result?`<span class="badge gold">${label}</span>`:''}</div><h3>${esc(q.question)}</h3>${show?`${selected!==null?`<div class="written-review"><b>你的作答</b><p>${esc(typeof selected==='string'&&selected.trim()?selected:'未作答')}</p></div>`:''}${hintsHtml(q)}${result?`<div class="self-assess"><span>对照提示自评：</span><button class="secondary ${assessment==='mastered'?'chosen':''}" data-assess="mastered" data-id="${q.id}" aria-pressed="${assessment==='mastered'}">已掌握</button><button class="secondary ${assessment==='review'?'chosen':''}" data-assess="review" data-id="${q.id}" aria-pressed="${assessment==='review'}">还需复习</button></div><p class="note">“还需复习”会加入错题本；“已掌握”会移出。自评不改变客观题得分。</p>`:''}${sourceHtml(q)}`:`<button class="text-btn" data-reveal="${esc(q.id)}">展开作答提示 ↓</button>`}</article>`;}

document.addEventListener('click',e=>{
  const assessment=e.target.closest('[data-assess]');if(assessment&&session?.submittedAt){const id=assessment.dataset.id,q=byId.get(id);if(!q||!Engine.subjective(q)||!session.paper.some(p=>p.id===id))return;const value=assessment.dataset.assess;if(!['mastered','review'].includes(value))return;session.selfAssess=session.selfAssess||{};session.selfAssess[id]=value;if(value==='mastered')delete wrong[id];else wrong[id]={count:Math.max(1,Number(wrong[id]?.count)||0),lastAt:Date.now(),subjective:true};persist();updateNav();renderResults();toast(value==='mastered'?'已标记掌握，已移出错题本':'已加入错题本，便于集中复习');return;}

  const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return;}
  const step=e.target.closest('[data-step]');if(step&&!step.disabled){const cfg=currentConfig(),t=step.dataset.step,available=Engine.counts(Engine.filterBank(BANK,cfg,Object.keys(wrong)));cfg.counts[t]=Math.max(0,Math.min(available[t],(Number(cfg.counts[t])||0)+Number(step.dataset.delta)));$('#count-'+t).value=cfg.counts[t];persist();updateSummary();return;}
  const goto=e.target.closest('[data-goto]');if(goto&&session){session.index=Number(goto.dataset.goto);persist();renderExam();return;}
  const reveal=e.target.closest('[data-reveal]');if(reveal){revealed.add(reveal.dataset.reveal);renderLibraryList();return;}
  const filter=e.target.closest('[data-review]');if(filter){reviewFilter=filter.dataset.review;reviewPage=1;renderResults();return;}
  const page=e.target.closest('[data-page]');if(page&&!page.disabled){if(page.dataset.page==='library'){libPage=Number(page.dataset.value);renderLibraryList();}else{reviewPage=Number(page.dataset.value);renderReviewList();}window.scrollTo({top:0,behavior:'instant'});return;}
  const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
  if(action==='go-home'||action==='save-home'){persist();navigate('home');}
  if(action==='go-wrong')navigate('wrong');
  if(action==='all-chapters'){currentConfig().chapters=[1,2,3,4,5];persist();renderHome();}
  if(action==='fill-counts'){currentConfig().counts=Engine.counts(Engine.filterBank(BANK,currentConfig(),Object.keys(wrong)));persist();renderHome();}
  if(action==='start')startRequested();
  if(action==='resume')navigate('exam');
  if(action==='last-results')navigate('results');
  if(action==='subjective-preset'){currentConfig().counts={single:0,multiple:0,judge:0,short:4,essay:2};clampCounts(currentConfig());persist();renderHome();}
  if(action==='submit')submitRequested();
  if(action==='prev'&&session.index>0){session.index--;persist();renderExam();}
  if(action==='next'){if(session.index<session.paper.length-1){session.index++;persist();renderExam();window.scrollTo({top:0,behavior:'instant'});}else submitRequested();}
  if(action==='flag'){const id=session.paper[session.index].id;session.flags=session.flags.includes(id)?session.flags.filter(x=>x!==id):[...session.flags,id];persist();renderExam();}
  if(action==='clear-answer'){delete session.answers[session.paper[session.index].id];persist();renderExam();}
  if(action==='again'){const cfg=clone(session.config||defaults());clampCounts(cfg);if(Object.values(cfg.counts).reduce((a,b)=>a+b,0)>0)begin(cfg);else{toast('这个范围已无可抽题目，请重新配置');navigate('home');}}
  if(action==='redo'){const previous=session;const cfg=clone(previous.config||defaults());session={paper:Engine.shuffle(previous.paper).map(p=>({id:p.id,order:cfg.shuffleOptions&&byId.get(p.id).type!=='judge'?Engine.shuffle(p.order):[...p.order]})),answers:{},selfAssess:{},flags:[],index:0,startedAt:Date.now(),submittedAt:null,config:cfg};persist();navigate('exam');}
  if(action==='clear-storage')confirmAction('清除本机练习记录？','当前作答、自评、进度、错题本和历史成绩都会被删除。题库仍然可以正常使用。',()=>{session=null;wrong={};history=[];config=defaults();wrongConfig={...defaults(),wrongOnly:true};persist();updateNav();renderHelp();toast('练习记录已清除');},'清除记录');
});
document.addEventListener('change',e=>{
  const target=e.target;
  if(target.name==='source'){currentConfig().source=target.value;clampCounts(currentConfig());persist();renderHome();}
  if(target.name==='chapter'){currentConfig().chapters=$$('input[name="chapter"]:checked').map(x=>Number(x.value));clampCounts(currentConfig());persist();renderHome();}
  if(target.id==='shuffleOptions'){currentConfig().shuffleOptions=target.checked;persist();}
  if(target.name==='count'){const t=target.dataset.type,n=Number(target.value),max=Number(target.max);if(!Number.isInteger(n)||n<0||n>max){currentConfig().counts[t]=Math.max(0,Math.min(max,Math.floor(n)||0));target.value=currentConfig().counts[t];toast(`题量已调整为 0 到 ${max} 之间的整数`);}persist();updateSummary();}
  if(target.name==='exam-answer')answerChanged();
  if(target.id==='libType'){libType=target.value;libPage=1;renderLibraryList();}
  if(target.id==='libSource'){libSource=target.value;libPage=1;renderLibraryList();}
});
document.addEventListener('input',e=>{if(e.target.id==='writtenAnswer'){writtenAnswerChanged();return;}if(e.target.name==='count'){currentConfig().counts[e.target.dataset.type]=Number(e.target.value);updateSummary();}if(e.target.id==='searchInput'){libQuery=e.target.value;libPage=1;renderLibraryList();}});
window.addEventListener('beforeunload',persist);
setInterval(()=>{for(const el of $$('[data-time]'))el.textContent=sessionTime();},1000);
updateNav();render();
</script></body></html>
