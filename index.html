  const typeNames={single:'单选题',multiple:'多选题',judge:'判断题'};
  function random(){if(globalThis.crypto?.getRandomValues){const a=new Uint32Array(1);globalThis.crypto.getRandomValues(a);return a[0]/4294967296;}return Math.random();}
  function shuffle(items,rng=random){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
  function filterBank(bank,config,wrongIds=[]){const wrong=new Set(wrongIds);return bank.filter(q=>config.chapters.includes(q.chapter)&&(!config.wrongOnly||wrong.has(q.id))&&(config.source==='all'||config.source==='red'&&q.red||config.source==='word'&&q.sources.some(s=>s.kind==='word')||config.source==='excel'&&q.sources.some(s=>s.kind==='excel')));}
  function counts(bank){return Object.fromEntries(Object.keys(typeNames).map(t=>[t,bank.filter(q=>q.type===t).length]));}
  function createPaper(bank,config,wrongIds=[],rng=random){
    const pool=filterBank(bank,config,wrongIds);let selected=[];
    for(const t of Object.keys(typeNames)){
      const n=Number(config.counts[t]);if(!Number.isInteger(n)||n<0)throw Error('题量须为大于或等于0的整数');
      const candidates=pool.filter(q=>q.type===t);if(n>candidates.length)throw Error(`${typeNames[t]}最多可抽 ${candidates.length} 道`);
      selected.push(...shuffle(candidates,rng).slice(0,n));
    }
    if(!selected.length)throw Error('至少选择一道题');
    return shuffle(selected,rng).map(q=>({id:q.id,order:config.shuffleOptions&&q.type!=='judge'?shuffle(q.options.map(o=>o.id),rng):q.options.map(o=>o.id)}));
  }
  function isCorrect(q,selection=[]){return selection.length===q.correct.length&&new Set(selection).size===selection.length&&selection.every(id=>q.correct.includes(id));}
  function grade(bank,paper,answers){const map=new Map(bank.map(q=>[q.id,q]));const results=paper.map(item=>{const q=map.get(item.id);if(!q)throw Error('试卷题目不存在');const chosen=answers[q.id]||[];return {id:q.id,correct:isCorrect(q,chosen),blank:!chosen.length};});const correct=results.filter(r=>r.correct).length;return {results,total:paper.length,correct,wrong:results.filter(r=>!r.correct&&!r.blank).length,blank:results.filter(r=>r.blank).length,percent:paper.length?Math.round(correct/paper.length*100):0};}
  function validSession(session,bank){
    if(!session||!Array.isArray(session.paper)||!session.paper.length||!session.answers)return false;
    const map=new Map(bank.map(q=>[q.id,q]));const ids=new Set();
    for(const item of session.paper){const q=map.get(item.id);if(!q||ids.has(item.id)||!Array.isArray(item.order)||item.order.length!==q.options.length||new Set(item.order).size!==q.options.length||item.order.some(id=>!q.options.some(o=>o.id===id)))return false;ids.add(item.id);const a=session.answers[item.id]||[];if(!Array.isArray(a)||new Set(a).size!==a.length||a.some(id=>!item.order.includes(id))||(q.type!=='multiple'&&a.length>1))return false;}
    return Number.isFinite(session.startedAt)&&Number.isInteger(session.index)&&session.index>=0&&session.index<session.paper.length;
  }
  return {typeNames,shuffle,filterBank,counts,createPaper,isCorrect,grade,validSession};
}
if(typeof module!=='undefined')module.exports=createQuizEngine;

'use strict';
const DATA=JSON.parse(document.getElementById('bank-data').textContent);

let history=Array.isArray(saved.history)?saved.history.filter(x=>x&&Number.isFinite(x.total)&&Number.isFinite(x.correct)&&Number.isFinite(x.at)).slice(0,30):[];
let view='home',libPage=1,libQuery='',libType='all',libSource='all',revealed=new Set(),reviewFilter='wrong',reviewPage=1;
let dialogCallback=null,toastTimer;

function duration(ms){const sec=Math.max(0,Math.floor(ms/1000));return [Math.floor(sec/3600),Math.floor(sec/60)%60,sec%60].map(n=>String(n).padStart(2,'0')).join(':');}
function sessionTime(){return session?duration((session.submittedAt||Date.now())-session.startedAt):'00:00:00';}
function answeredCount(){return session?session.paper.filter(q=>(session.answers[q.id]||[]).length>0).length:0;}
function updateNav(){for(const b of $$('[data-nav]')){const active=b.dataset.nav===view||(view==='exam'||view==='results')&&b.dataset.nav==='home';b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}$('#wrongCount').textContent=Object.keys(wrong).length;$('#bankTotal').textContent=DATA.meta.total;}
function navigate(next){view=next;updateNav();render();window.scrollTo({top:0,behavior:'instant'});}

function clampCounts(cfg){const available=Engine.counts(Engine.filterBank(BANK,cfg,Object.keys(wrong)));for(const t of Object.keys(TYPE_NAMES))cfg.counts[t]=Math.max(0,Math.min(Number(cfg.counts[t])||0,available[t]));return available;}
function renderHome(){

  if(isWrong&&!Object.keys(wrong).length){$('#content').innerHTML=`<div class="hero"><div><div class="eyebrow">REVIEW & GROW</div><h1>我的错题</h1><p>每次交卷后，答错和未答的题目会自动收录在这里。</p></div></div><div class="card empty"><div class="empty-symbol">◎</div><h2>还没有错题</h2><p>先完成一份练习，再回来集中复习。</p><button class="primary" data-action="go-home" style="margin-top:24px">开始模拟练习</button></div>`;return;}

  $('#content').innerHTML=`<header class="hero"><div><div class="eyebrow">${isWrong?'FOCUS ON WHAT MATTERS':'YOUR PRACTICE, YOUR PACE'}</div><h1>${isWrong?'让错题变成会做的题。':'自定义一份练习。'}</h1><p>${isWrong?`错题本现有 ${Object.keys(wrong).length} 道题。重做答对后，将自动从错题本移出。`:'选择章节、题型和题量，每次生成顺序不同的新试卷。'}</p></div><span class="edition">薛高连 · 张冬梅 / 第二版</span></header>
  ${unfinished?`<div class="resume"><div><strong>上次的练习还在这里</strong><p>已答 ${answeredCount()} / ${session.paper.length} 题，继续时会保留选项顺序与答案。</p></div><button class="secondary" data-action="resume">继续作答 →</button></div>`:''}

打乱单选、多选的选项顺序</label><div class="row" style="font-size:13px"><span style="color:var(--green)">✓</span>交卷后统一查看答案、解析和得分</div></div></section><aside><section class="card summary"><h3>本次练习</h3><div class="large-number" id="total-display">0<span>题</span></div><p style="color:#b7cbbd;font-size:13px">从所选范围随机抽取，不重复出题。</p><div class="summary-list"><div class="between"><span>单选题</span><b id="sum-single">0 道</b></div><div class="between"><span>多选题</span><b id="sum-multiple">0 道</b></div><div class="between"><span>判断题</span><b id="sum-judge">0 道</b></div><div class="between"><span>计分方式</span><span>每题 1 分</span></div></div><button class="primary full" id="startButton" data-action="start">生成试卷并开始 →</button><p class="note">多选题漏选、多选均不得分。未答题计 0 分。</p></section><p class="note" style="padding:0 9px">${isWrong?'重复练习只从当前错题本抽取。':'合并两份复习资料，435 道客观题。Word 标红内容已改为选择题，答案随本次选项顺序显示。'}</p>${!storageOK?'<p class="note" style="color:var(--red)">当前浏览器无法保存进度，请完成后再关闭页面。</p>':''}</aside></div><div class="stats-strip"><div class="stat"><b>${DATA.meta.excelQuestions}</b><span>Excel 客观题</span></div><div class="stat"><b>${DATA.meta.wordNewQuestions}</b><span>Word 补入题目</span></div><div class="stat"><b>${DATA.meta.redParagraphs}</b><span>已覆盖标红段落</span></div></div>`;

function updateSummary(){const cfg=currentConfig();let total=0,valid=cfg.chapters.length>0;const available=Engine.counts(Engine.filterBank(BANK,cfg,Object.keys(wrong)));for(const t of Object.keys(TYPE_NAMES)){const n=Number(cfg.counts[t]);if(!Number.isInteger(n)||n<0||n>available[t])valid=false;total+=Number.isFinite(n)?n:0;const el=$('#sum-'+t);if(el)el.textContent=n+' 道';}if($('#total-display'))$('#total-display').innerHTML=esc(total)+'<span>题</span>';if($('#startButton'))$('#startButton').disabled=!valid||total<=0;}
function begin(cfg){
  try{const paper=Engine.createPaper(BANK,cfg,Object.keys(wrong));session={paper,answers:{},flags:[],index:0,startedAt:Date.now(),submittedAt:null,config:clone(cfg)};persist();navigate('exam');}catch(e){toast(e.message);}
}
function startRequested(){const cfg=clone(currentConfig());if(session&&!session.submittedAt)confirmAction('开始一份新试卷？','当前未完成试卷将被替换。已经交卷的历史记录和错题本会保留。',()=>begin(cfg),'生成新试卷');else begin(cfg);}
function letterFor(item,optionId,q){if(q.type==='judge')return optionId==='T'?'√':'×';return String.fromCharCode(65+item.order.indexOf(optionId));}
function renderExam(){

="exam-progress" style="width:${answeredCount()/session.paper.length*100}%"></span></div><div class="answer-grid">${session.paper.map((p,i)=>`<button data-goto="${i}" class="${(session.answers[p.id]||[]).length?'done ':''}${i===session.index?'current ':''}${session.flags.includes(p.id)?'flagged':''}" aria-label="第${i+1}题${(session.answers[p.id]||[]).length?'，已作答':'，未作答'}" ${i===session.index?'aria-current="step"':''}>${i+1}</button>`).join('')}</div><div class="legend"><span>浅绿 · 已答</span><span>白色 · 未答</span><span>金点 · 标记</span></div><button class="primary full" data-action="submit">交卷并查看结果</button><p class="note">可直接点题号跳转。答案会自动保存。</p></aside></div>`;

function answerChanged(){if(!session||session.submittedAt)return;const q=byId.get(session.paper[session.index].id);session.answers[q.id]=$$('input[name="exam-answer"]:checked').map(i=>i.value);for(const input of $$('input[name="exam-answer"]'))input.closest('.option').classList.toggle('selected',input.checked);persist();const done=answeredCount();$('#answered-label').textContent=`已答 ${done} / ${session.paper.length}`;$('#exam-progress').style.width=done/session.paper.length*100+'%';const current=$(`[data-goto="${session.index}"]`);current.classList.toggle('done',(session.answers[q.id]||[]).length>0);current.setAttribute('aria-label',`第${session.index+1}题${(session.answers[q.id]||[]).length?'，已作答':'，未作答'}`);}
function submitRequested(){if(!session||session.submittedAt)return;const blank=session.paper.length-answeredCount();confirmAction('确认交卷？',`本次共 ${session.paper.length} 道题，已答 ${answeredCount()} 道。${blank?`\n还有 ${blank} 道未作答，将按 0 分计入并收录到错题本。`:'\n所有题目均已作答。交卷后可查看答案和解析。'}`,submitPaper,'确认交卷');}
function submitPaper(){if(!session||session.submittedAt)return;session.submittedAt=Date.now();const g=Engine.grade(BANK,session.paper,session.answers);for(const r of g.results){if(r.correct)delete wrong[r.id];else wrong[r.id]={count:(Number(wrong[r.id]?.count)||0)+1,lastAt:session.submittedAt,blank:r.blank};}history.unshift({at:session.submittedAt,total:g.total,correct:g.correct,percent:g.percent,duration:session.submittedAt-session.startedAt});history=history.slice(0,30);reviewFilter='wrong';reviewPage=1;persist();navigate('results');}
function sourceHtml(q){return `<details class="source"><summary>查看题目来源${q.supplemented?' · 含补充选项':''}</summary>${q.sources.map(s=>`<p>${esc(s.label)}</p>${s.excerpt?`<blockquote>${esc(s.excerpt)}</blockquote>`:''}`).join('')}${q.referenceIds.length?'<p>核对资料：'+q.referenceIds.map(id=>{const r=DATA.references[id];return r&&/^https?:\/\//.test(r.url)?`<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title)}</a>`:esc(id);}).join('；')+'</p>':''}</details>`;}
function answerText(q,item,ids){if(!ids?.length)return '未作答';return item.order.filter(id=>ids.includes(id)).map(id=>`${q.type==='judge'?'':letterFor(item,id,q)+'. '}${q.options.find(o=>o.id===id).text}`).join('；');}
function questionCard(q,item,{show=false,selected=null,result=null,number=null}={}){
  return `<article class="review-card"><div class="between"><div class="q-meta" style="margin:0"><span class="badge">${TYPE_NAMES[q.type]}</span>${q.red?'<span class="badge gold">Word 标红</span>':''}<small>${esc(DATA.meta.chapters[q.chapter-1])}${number?' · 第 '+number+' 题':''}</small></div>${result?`<span class="badge ${result.correct?'':'red'}">${result.correct?'正确':result.blank?'未答':'错误'}</span>`:''}</div><h3>${esc(q.question)}</h3><div class="review-options">${item.order.map(id=>{const option=q.options.find(o=>o.id===id);const cls=show?(q.correct.includes(id)?'correct':selected?.includes(id)?'incorrect':''):'';return `<div class="review-option ${cls}">${q.type==='judge'?'':letterFor(item,id,q)+'. '}${esc(option.text)}${show&&q.correct.includes(id)?' <span aria-label="正确选项">✓</span>':''}${show&&selected?.includes(id)?' <small>（你的选择）</small>':''}</div>`;}).join('')}</div>${show?`<div class="answer-info">${selected!==null?`<p><b>你的答案：</b>${esc(answerText(q,item,selected))}</p>`:''}<p><b>正确答案：</b>${esc(answerText(q,item,q.correct))}</p><p><b>解析：</b>${esc(q.explanation)}</p>${q.note&&q.note!=='基础概念'?`<p class="muted">${esc(q.note)}</p>`:''}</div>${sourceHtml(q)}`:`<button class="text-btn" data-reveal="${esc(q.id)}">展开答案与解析 ↓</button>`}</article>`;
}
function pager(page,total,kind){const pages=Math.max(1,Math.ceil(total/20));return `<div class="pager"><button class="secondary" data-page="${kind}" data-value="${page-1}" ${page<=1?'disabled':''}>上一页</button><span>第 ${page} / ${pages} 页</span><button class="secondary" data-page="${kind}" data-value="${page+1}" ${page>=pages?'disabled':''}>下一页</button></div>`;}
function renderResults(){
  if(!session?.submittedAt){navigate(session?'exam':'home');return;}
  const g=Engine.grade(BANK,session.paper,session.answers);
  $('#content').innerHTML=`<header class="hero"><div><div class="eyebrow">PRACTICE COMPLETE</div><h1>完成一次练习，进一步掌握。</h1><p>核对答案和解析，把不确定的知识点再过一遍。</p></div></header><section class="card result-top"><div class="score-ring" style="--score:${g.percent*3.6}deg"><div class="score-inner"><b>${g.percent}<span style="font-size:20px">%</span></b><small>正确率</small></div></div><div><h2>答对 ${g.correct} / ${g.total} 题</h2><div class="result-stats"><div><b>${g.correct}</b><span>正确</span></div><div><b>${g.wrong}</b><span>错误</span></div><div><b>${g.blank}</b><span>未答</span></div><div><b style="font-size:19px">${sessionTime()}</b><span>用时</span></div></div><div class="toolbar"><button class="primary" data-action="again">按原配置再抽一套</button><button class="secondary" data-action="redo">重做本卷</button><button class="text-btn" data-action="go-wrong">进入错题本 →</button></div><p class="note">每题 1 分，多选完全正确才得分。错题本已更新。</p></div></section><div class="between" style="margin-top:28px"><h2>答案复盘</h2><small>${g.total} 道题</small></div><div class="pill-tabs">${[['wrong','错题与未答',g.total-g.correct],['all','全部题目',g.total],['flagged','已标记',session.flags.length]].map(([v,label,n])=>`<button data-review="${v}" class="${reviewFilter===v?'active':''}">${label} ${n}</button>`).join('')}</div><div id="review-list"></div>`;
  renderReviewList();
}
function renderReviewList(){const g=Engine.grade(BANK,session.paper,session.answers);let items=session.paper.map((p,i)=>({p,i,r:g.results[i]}));if(reviewFilter==='wrong')items=items.filter(x=>!x.r.correct);if(reviewFilter==='flagged')items=items.filter(x=>session.flags.includes(x.p.id));const pages=Math.max(1,Math.ceil(items.length/20));reviewPage=Math.min(reviewPage,pages);$('#review-list').innerHTML=items.length?items.slice((reviewPage-1)*20,reviewPage*20).map(x=>questionCard(byId.get(x.p.id),x.p,{show:true,selected:session.answers[x.p.id]||[],result:x.r,number:x.i+1})).join('')+pager(reviewPage,items.length,'review'):`<div class="card empty"><div class="empty-symbol">✓</div><h2>${reviewFilter==='wrong'?'本次全部答对':'没有已标记的题目'}</h2><p>可以切换到全部题目查看完整解析。</p></div>`;}
function renderLibrary(){
  $('#content').innerHTML=`<header class="hero"><div><div class="eyebrow">QUESTION LIBRARY</div><h1>把知识点逐个弄清楚。</h1><p>搜索题干、选项与解析；点开答案查看资料来源。</p></div><span class="edition">共 ${DATA.meta.total} 道客观题</span></header><div class="search"><label class="sr-only" for="searchInput">搜索题库</label><input type="search" id="searchInput" placeholder="搜索关键词，如：国防动员、孙子兵法…" value="${esc(libQuery)}"><label class="sr-only" for="libType">筛选题型</label><select id="libType"><option value="all">全部题型</option>${Object.entries(TYPE_NAMES).map(([v,t])=>`<option value="${v}" ${libType===v?'selected':''}>${t}</option>`).join('')}</select><label class="sr-only" for="libSource">筛选来源</label><select id="libSource">${[['all','全部来源'],['red','Word 标红'],['word','Word 全部'],['excel','Excel 题库']].map(([v,t])=>`<option value="${v}" ${libSource===v?'selected':''}>${t}</option>`).join('')}</select></div><div id="library-list"></div>`;renderLibraryList();
}
function renderLibraryList(){const term=libQuery.trim().toLocaleLowerCase();const pool=Engine.filterBank(BANK,{chapters:[1,2,3,4,5],source:libSource,wrongOnly:false});const filtered=pool.filter(q=>(libType==='all'||q.type===libType)&&(!term||[q.question,q.explanation,...q.options.map(o=>o.text)].join(' ').toLocaleLowerCase().includes(term)));libPage=Math.min(libPage,Math.max(1,Math.ceil(filtered.length/20)));$('#library-list').innerHTML=`<p class="library-caption">找到 ${filtered.length} 道题 · 每页 20 道</p>`+(filtered.length?filtered.slice((libPage-1)*20,libPage*20).map(q=>questionCard(q,{id:q.id,order:q.options.map(o=>o.id)},{show:revealed.has(q.id)})).join('')+pager(libPage,filtered.length,'library'):'<div class="card empty"><h2>没有找到相关题目</h2><p>试试更短的关键词或更换筛选范围。</p></div>');}

document.addEventListener('click',e=>{
  const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return;}
  const step=e.target.closest('[data-step]');if(step&&!step.disabled){const cfg=currentConfig(),t=step.dataset.step,available=Engine.counts(Engine.filterBank(BANK,cfg,Object.keys(wrong)));cfg.counts[t]=Math.max(0,Math.min(available[t],(Number(cfg.counts[t])||0)+Number(step.dataset.delta)));$('#count-'+t).value=cfg.counts[t];persist();updateSummary();return;}
  const goto=e.target.closest('[data-goto]');if(goto&&session){session.index=Number(goto.dataset.goto);persist();renderExam();return;}
  const reveal=e.target.closest('[data-reveal]');if(reveal){revealed.add(reveal.dataset.reveal);renderLibraryList();return;}
  const filter=e.target.closest('[data-review]');if(filter){reviewFilter=filter.dataset.review;reviewPage=1;renderResults();return;}
  const page=e.target.closest('[data-page]');if(page&&!page.disabled){if(page.dataset.page==='library'){libPage=Number(page.dataset.value);renderLibraryList();}else{reviewPage=Number(page.dataset.value);renderReviewList();}window.scrollTo({top:0,behavior:'instant'});return;}
  const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
  if(action==='go-home'||action==='save-home'){persist();navigate('home');}
  if(action==='go-wrong')navigate('wrong');
  if(action==='all-chapters'){currentConfig().chapters=[1,2,3,4,5];persist();renderHome();}
  if(action==='fill-counts'){currentConfig().counts=Engine.counts(Engine.filterBank(BANK,currentConfig(),Object.keys(wrong)));persist();renderHome();}
  if(action==='start')startRequested();
  if(action==='resume')navigate('exam');
  if(action==='submit')submitRequested();
  if(action==='prev'&&session.index>0){session.index--;persist();renderExam();}
  if(action==='next'){if(session.index<session.paper.length-1){session.index++;persist();renderExam();window.scrollTo({top:0,behavior:'instant'});}else submitRequested();}
  if(action==='flag'){const id=session.paper[session.index].id;session.flags=session.flags.includes(id)?session.flags.filter(x=>x!==id):[...session.flags,id];persist();renderExam();}
  if(action==='clear-answer'){delete session.answers[session.paper[session.index].id];persist();renderExam();}
  if(action==='again'){const cfg=clone(session.config||defaults());clampCounts(cfg);if(Object.values(cfg.counts).reduce((a,b)=>a+b,0)>0)begin(cfg);else{toast('这个范围已无可抽题目，请重新配置');navigate('home');}}
  if(action==='redo'){const previous=session;const cfg=clone(previous.config||defaults());session={paper:Engine.shuffle(previous.paper).map(p=>({id:p.id,order:cfg.shuffleOptions&&byId.get(p.id).type!=='judge'?Engine.shuffle(p.order):[...p.order]})),answers:{},flags:[],index:0,startedAt:Date.now(),submittedAt:null,config:cfg};persist();navigate('exam');}
  if(action==='clear-storage')confirmAction('清除本机练习记录？','当前进度、错题本和历史成绩都会被删除。题库仍然可以正常使用。',()=>{session=null;wrong={};history=[];config=defaults();wrongConfig={...defaults(),wrongOnly:true};persist();updateNav();renderHelp();toast('练习记录已清除');},'清除记录');
});
document.addEventListener('change',e=>{
  const target=e.target;
  if(target.name==='source'){currentConfig().source=target.value;clampCounts(currentConfig());persist();renderHome();}
  if(target.name==='chapter'){currentConfig().chapters=$$('input[name="chapter"]:checked').map(x=>Number(x.value));clampCounts(currentConfig());persist();renderHome();}
  if(target.id==='shuffleOptions'){currentConfig().shuffleOptions=target.checked;persist();}
  if(target.name==='count'){const t=target.dataset.type,n=Number(target.value),max=Number(target.max);if(!Number.isInteger(n)||n<0||n>max){currentConfig().counts[t]=Math.max(0,Math.min(max,Math.floor(n)||0));target.value=currentConfig().counts[t];toast(`题量已调整为 0 到 ${max} 之间的整数`);}persist();updateSummary();}
  if(target.name==='exam-answer')answerChanged();
  if(target.id==='libType'){libType=target.value;libPage=1;renderLibraryList();}
  if(target.id==='libSource'){libSource=target.value;libPage=1;renderLibraryList();}
});
document.addEventListener('input',e=>{if(e.target.name==='count'){currentConfig().counts[e.target.dataset.type]=Number(e.target.value);updateSummary();}if(e.target.id==='searchInput'){libQuery=e.target.value;libPage=1;renderLibraryList();}});
window.addEventListener('beforeunload',persist);
setInterval(()=>{for(const el of $$('[data-time]'))el.textContent=sessionTime();},1000);
updateNav();render();
</script></body></html>
